<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <!-- IBM Plex Mono Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (Using CDN for standalone file, though classes are standard v4/v3 compatible) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="min-h-screen flex flex-col items-center p-4 sm:p-8 text-black pb-32">

    <!-- Header Section -->
    <header class="w-full max-w-5xl flex justify-between items-start mb-16 sm:mb-20 mt-4">
        <div class="text-xs sm:text-sm leading-tight">
            <span class="text-gray-500">Made by</span><br>
            <strong class="font-bold text-base">Alaa Al-Ansi</strong>
        </div>
        <a href="https://github.com/alaaoaw3-hash/Unit-Converter" target="_blank" rel="noopener noreferrer"
            class="flex items-center gap-2 text-sm hover:opacity-70 transition-opacity">
            <div class="text-right leading-tight hidden sm:block">
                <span class="font-bold text-base">GitHub</span><br>
                <span class="text-gray-500 text-xs">repo</span>
            </div>
            <svg height="32" width="32" viewBox="0 0 16 16" fill="currentColor">
                <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
                </path>
            </svg>
        </a>
    </header>

    <!-- Hero Title -->
    <div class="text-center mb-16 flex flex-col items-center">
        <h1 class="text-4xl sm:text-5xl font-bold tracking-tight mb-0">unit</h1>
        <h2 class="text-6xl sm:text-8xl md:text-9xl font-bold tracking-tighter leading-none mt-[-10px]">Converter</h2>
    </div>

    <!-- Main Content Grid -->
    <main class="w-full max-w-4xl grid md:grid-cols-2 gap-6 sm:gap-8">

        <!-- Left Card (Input Section) -->
        <div class="bg-white border-[3px] border-black rounded-3xl p-6 sm:p-8 flex flex-col shadow-sm">

            <!-- Tabs -->
            <div class="flex gap-4 sm:gap-6 mb-8 text-base sm:text-lg font-bold" id="tabs">
                <button class="tab-btn text-black transition-colors" data-unit="Length">Length</button>
                <button class="tab-btn text-gray-300 hover:text-gray-500 transition-colors"
                    data-unit="Weight">Weight</button>
                <button class="tab-btn text-gray-300 hover:text-gray-500 transition-colors"
                    data-unit="Temperature">Temperature</button>
            </div>

            <!-- Inputs Form -->
            <div class="space-y-6 flex-grow">
                <div>
                    <label class="block text-sm font-semibold mb-2" id="inputLabel">Enter Length to convert</label>
                    <input type="number" id="inputValue"
                        class="w-full border-2 border-black rounded-xl p-3 sm:p-4 text-sm sm:text-base outline-none focus:ring-2 focus:ring-black focus:ring-offset-1 transition-all placeholder:text-gray-400">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">Unit to convert from</label>
                    <div class="select-wrapper custom-select" id="fromUnitWrapper">
                        <div class="w-full border-2 border-black rounded-xl p-3 sm:p-4 text-sm sm:text-base bg-white cursor-pointer transition-all outline-none"
                            id="fromUnitTrigger" tabindex="0">
                            <span id="fromUnitLabel">mm</span>
                            <input type="hidden" id="fromUnit" value="mm">
                        </div>
                        <div class="arrow">
                            <svg width="12" height="8" viewBox="0 0 12 8" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 1.5L6 6.5L11 1.5" stroke="black" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </div>
                        <svg class="marching-ants">
                            <rect />
                        </svg>
                        <div class="dropdown-menu hidden" id="fromUnitMenu">
                            <!-- Options populated via JS -->
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">Unit to convert to</label>
                    <div class="select-wrapper custom-select" id="toUnitWrapper">
                        <div class="w-full border-2 border-black rounded-xl p-3 sm:p-4 text-sm sm:text-base bg-white cursor-pointer transition-all outline-none"
                            id="toUnitTrigger" tabindex="0">
                            <span id="toUnitLabel">cm</span>
                            <input type="hidden" id="toUnit" value="cm">
                        </div>
                        <div class="arrow">
                            <svg width="12" height="8" viewBox="0 0 12 8" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 1.5L6 6.5L11 1.5" stroke="black" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </div>
                        <svg class="marching-ants">
                            <rect />
                        </svg>
                        <div class="dropdown-menu hidden" id="toUnitMenu">
                            <!-- Options populated via JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Convert Button -->
            <div class="mt-10">
                <button id="convertBtn"
                    class="border-2 border-black rounded-full px-6 py-2 text-sm font-bold hover:bg-black hover:text-white transition-colors active:scale-95">
                    Convert
                </button>
            </div>
        </div>

        <!-- Right Card (Output Section) -->
        <div class="bg-white border-[3px] border-black rounded-3xl p-6 sm:p-8 flex flex-col min-h-[350px] shadow-sm">

            <!-- Top Label -->
            <div class="mb-12">
                <div class="text-xs font-semibold text-gray-500 mb-1" id="inputUnitLabel">input unit</div>
                <div class="text-2xl font-bold break-all" id="inputDisplay">0</div>
            </div>

            <!-- Main Output -->
            <div class="output-container">
                <div class="text-xs font-semibold text-gray-500 mb-2" id="outputUnitLabel">output unit</div>
                <div class="flex center gap-1 font-bold w-full">
                    <span class="text-5xl sm:text-7xl leading-none flex-shrink-0">=</span>
                    <span class="auto-scale-text mt-2.5" id="outputDisplay">0.00</span>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script src="js/script.js"></script>
    <div style="height: 300px;"></div>
</body>

</html>
